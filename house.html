<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House Architectural Explorer — NULAR (Nusa Learn)</title>
  <meta name="description" content="Jelajahi model 3D interaktif, anatomi komponen bangunan, material konstruksi, makna budaya, dan rujukan resmi rumah tradisional Indonesia di NULAR." />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="css/museum.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three/build/three.module.js",
      "three/addons/": "./js/vendor/three/"
    }
  }
  </script>
</head>
<body>
  <div id="museum-header-mount"></div>

  <main id="main-content">
    <div id="house-page-root">
      <div class="museum-container" style="padding:80px 24px;text-align:center;">
        <span class="eyebrow">Memuat Dossier Arsitektur</span>
        <p class="lead-copy" style="margin:12px auto 0;">Menyiapkan data rumah tradisional dan modul penampil 3D...</p>
      </div>
    </div>
  </main>

  <div id="museum-footer-mount"></div>

  <script type="module">
    import { loadHouses, getRelatedHouses } from './js/museum-data.js';
    import { MuseumStore } from './js/museum-store.js';
    import { initMuseumShell, renderHouseCard, bindSaveButtons, escapeHtml } from './js/museum-shell.js';
    import { NularArchitectureViewer } from './js/viewer-3d.js';

    initMuseumShell('explore');
    bindSaveButtons(document);

    let viewerInstance = null;

    function renderInspectorDetail(house, hotspot) {
      const container = document.getElementById('inspector-body');
      const headTitle = document.getElementById('inspector-heading');
      if (!container) return;

      if (!hotspot) {
        if (headTitle) headTitle.textContent = `Anatomi Komponen (${house.hotspots.length})`;
        container.innerHTML = `
          <p style="font-size:0.84rem;color:var(--ink-secondary);margin:0 0 14px;line-height:1.6;">
            Klik pin nomor pada model 3D, klik langsung bagian bangunan, atau pilih komponen dari daftar di bawah untuk memfokuskan kamera dan mempelajari detail tektoniknya.
          </p>
          <div class="inspector-list">
            ${house.hotspots.map((hs, idx) => `
              <button type="button" class="inspector-item" data-select-hotspot="${escapeHtml(hs.id)}">
                <div>
                  <div class="mono-caption" style="color:var(--bronze);">0${idx + 1} · ${escapeHtml(hs.localName)}</div>
                  <div style="font-weight:600;font-size:0.88rem;color:var(--ink-primary);margin-top:2px;">${escapeHtml(hs.title)}</div>
                </div>
                <span class="material-symbols-outlined" style="font-size:18px;color:var(--ink-muted);" aria-hidden="true">center_focus_strong</span>
              </button>
            `).join('')}
          </div>
          ${house.modelCapabilities?.limitationsNote ? `
            <div style="margin-top:16px;padding:12px;background:var(--bg-sandstone);border-left:2px solid var(--bronze);font-size:0.78rem;color:var(--ink-secondary);line-height:1.55;">
              <strong>Catatan Cakupan Model 3D:</strong> ${escapeHtml(house.modelCapabilities.limitationsNote)}
            </div>
          ` : ''}
        `;
        return;
      }

      if (headTitle) headTitle.textContent = hotspot.title;
      container.innerHTML = `
        <button type="button" id="back-to-component-list" class="btn-museum btn-museum--secondary btn-museum--sm" style="margin-bottom:16px;">
          <span class="material-symbols-outlined" style="font-size:15px" aria-hidden="true">arrow_back</span>
          <span>Semua Komponen (${house.hotspots.length})</span>
        </button>

        <div class="mono-caption" style="color:var(--bronze);">Nama Lokal Terdokumentasi</div>
        <h3 style="font-family:var(--font-serif);font-size:1.35rem;margin:4px 0 4px;">${escapeHtml(hotspot.localName)}</h3>
        <p style="font-size:0.84rem;color:var(--ink-muted);margin:0 0 16px;">${escapeHtml(hotspot.title)}</p>

        <div style="display:flex;flex-direction:column;gap:14px;">
          <div style="padding:12px 14px;background:var(--bg-ivory);border:1px solid var(--border-hairline);">
            <div class="spec-cell__label">Konstruksi & Material</div>
            <p style="margin:0;font-size:0.86rem;color:var(--ink-secondary);line-height:1.6;">${escapeHtml(hotspot.constructionAndMaterial)}</p>
          </div>
          <div style="padding:12px 14px;background:var(--bg-ivory);border:1px solid var(--border-hairline);">
            <div class="spec-cell__label">Fungsi Praktis & Struktural</div>
            <p style="margin:0;font-size:0.86rem;color:var(--ink-secondary);line-height:1.6;">${escapeHtml(hotspot.practicalFunction)}</p>
          </div>
          <div style="padding:12px 14px;background:var(--bg-ivory);border:1px solid var(--border-hairline);">
            <div class="spec-cell__label">Makna Budaya</div>
            <p style="margin:0;font-size:0.86rem;color:var(--ink-secondary);line-height:1.6;">${escapeHtml(hotspot.culturalMeaning)}</p>
          </div>
        </div>
      `;

      document.getElementById('back-to-component-list')?.addEventListener('click', () => {
        if (viewerInstance) viewerInstance.clearSelection();
        renderInspectorDetail(house, null);
      });
    }

    async function initHouseDetail() {
      const houses = await loadHouses();
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get('id') || 'rumah-gadang';
      const house = houses.find((h) => h.id === requestedId) || houses[0];

      document.title = `${house.houseName} (${house.province}) — NULAR Architecture Museum`;
      MuseumStore.recordHouseVisit(house.id);

      const is3D = house.modelStatus === 'available' && Boolean(house.model3DUrl);
      const isSaved = MuseumStore.isHouseSaved(house.id);
      const photo = house.referenceImages?.[0];
      const related = getRelatedHouses(house, houses);
      const existingNote = MuseumStore.getNote(house.id);
      const comparePartner = house.id === 'rumah-gadang' ? 'tongkonan-toraja' : 'rumah-gadang';

      const root = document.getElementById('house-page-root');
      root.innerHTML = `
        <!-- A. ARCHITECTURAL HERO & 3D VIEWER -->
        <section class="museum-section" style="padding-top:36px;padding-bottom:56px;">
          <div class="museum-container">
            <nav aria-label="Breadcrumb" style="margin-bottom:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;" class="mono-caption">
              <a href="index.html" style="text-decoration:underline;text-underline-offset:3px;">Home</a>
              <span>/</span>
              <a href="explore.html" style="text-decoration:underline;text-underline-offset:3px;">Explore</a>
              <span>/</span>
              <a href="explore.html?island=${encodeURIComponent(house.island)}" style="text-decoration:underline;text-underline-offset:3px;">${escapeHtml(house.island)}</a>
              <span>/</span>
              <span style="color:var(--ink-primary);">${escapeHtml(house.houseName)}</span>
            </nav>

            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;">
              <div>
                <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px;">
                  <span class="status-badge ${is3D ? 'status-badge--3d' : 'status-badge--prep'}">
                    ${is3D ? 'Model 3D Interaktif Tersedia' : 'Model 3D Sedang Disiapkan'}
                  </span>
                  <span class="mono-caption">${escapeHtml(house.heritageCategory)}</span>
                </div>
                <h1 class="display-title">${escapeHtml(house.houseName)}</h1>
                <p style="font-size:1.05rem;color:var(--ink-secondary);margin:8px 0 0;">
                  <em>${escapeHtml(house.localName)}</em> · ${escapeHtml(house.culturalCommunity)} · ${escapeHtml(house.province)}, ${escapeHtml(house.island)}
                </p>
                ${house.alternativeNames?.length ? `
                  <p class="mono-caption" style="margin:6px 0 0;">Nama lain: ${house.alternativeNames.map(escapeHtml).join(' · ')}</p>
                ` : ''}
              </div>

              <div style="display:flex;flex-wrap:wrap;gap:10px;">
                <button
                  type="button"
                  class="btn-museum ${isSaved ? 'btn-museum--bronze' : 'btn-museum--secondary'} btn-museum--sm"
                  data-toggle-save="${escapeHtml(house.id)}"
                  aria-pressed="${isSaved}"
                >
                  <span class="material-symbols-outlined" style="font-size:17px" aria-hidden="true">${isSaved ? 'bookmark' : 'bookmark_border'}</span>
                  <span>${isSaved ? 'Tersimpan di Jurnal' : 'Simpan ke Jurnal'}</span>
                </button>
                <a
                  href="anatomy.html?a=${encodeURIComponent(house.id)}&b=${encodeURIComponent(comparePartner)}#comparator"
                  class="btn-museum btn-museum--secondary btn-museum--sm"
                >
                  <span class="material-symbols-outlined" style="font-size:17px" aria-hidden="true">compare</span>
                  <span>Bandingkan Struktur</span>
                </a>
                <a
                  href="world.html?house=${encodeURIComponent(house.id)}"
                  class="btn-museum btn-museum--bronze btn-museum--sm"
                >
                  <span class="material-symbols-outlined" style="font-size:17px" aria-hidden="true">directions_walk</span>
                  <span>Masuk Dunia 3D</span>
                </a>
                ${is3D ? `
                  <a href="#explorer-stage" class="btn-museum btn-museum--primary btn-museum--sm">
                    <span class="material-symbols-outlined" style="font-size:17px" aria-hidden="true">view_in_ar</span>
                    <span>Explore in 3D</span>
                  </a>
                ` : ''}
              </div>
            </div>

            <!-- CORE 3D VIEWER OR VERIFIED PHOTOGRAPHIC DOCUMENTATION -->
            ${is3D ? `
              <div id="explorer-stage" class="viewer-shell viewer-shell--with-inspector">
                <div id="house-3d-stage" class="viewer-stage"></div>
                <aside class="inspector-panel" aria-label="Panel Informasi Komponen Arsitektur">
                  <div class="inspector-panel__head">
                    <div class="mono-caption" style="color:var(--bronze);">Inspektor Komponen 3D</div>
                    <h2 id="inspector-heading" style="font-family:var(--font-serif);font-size:1.2rem;margin:4px 0 0;">Anatomi Komponen (${house.hotspots.length})</h2>
                  </div>
                  <div id="inspector-body" class="inspector-panel__body"></div>
                </aside>
              </div>
              <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:10px;" class="mono-caption">
                <span>Format Aset: Binary glTF (.glb) · ${house.modelCapabilities.separatedComponents} Komponen Struktural Terpisah</span>
                <span>Pembuat Model: ${escapeHtml(house.assetCreator)} (${escapeHtml(house.assetLicense)})</span>
              </div>
            ` : `
              <div style="display:grid;grid-template-columns:1fr;border:1px solid var(--border-strong);background:var(--bg-paper);border-radius:var(--radius-sm);overflow:hidden;">
                <div style="position:relative;max-height:540px;overflow:hidden;background:#161b18;">
                  <img
                    src="${escapeHtml(photo?.url || '')}"
                    alt="${escapeHtml(photo?.caption || house.houseName)}"
                    style="width:100%;max-height:540px;object-fit:cover;"
                  />
                  <div style="position:absolute;top:16px;left:16px;">
                    <span class="status-badge status-badge--prep" style="background:rgba(250,247,242,0.94);">
                      Model 3D sedang disiapkan · Dokumentasi Foto Terverifikasi
                    </span>
                  </div>
                </div>
                <div style="padding:20px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;background:var(--bg-sandstone);">
                  <div>
                    <div style="font-weight:600;font-size:0.95rem;color:var(--ink-primary);">Status Pemodelan 3D: Model 3D sedang disiapkan</div>
                    <p style="margin:4px 0 0;font-size:0.86rem;color:var(--ink-secondary);max-width:68ch;">
                      NULAR tidak menggunakan model rumah generik untuk menggantikan tradisi asli. Sambil model 3D akurat ${escapeHtml(house.houseName)} sedang dalam proses riset geometri, Anda dapat mempelajari dokumentasi fotografis terverifikasi, sistem struktur, dan rujukan arsitekturnya di bawah ini.
                    </p>
                  </div>
                  <a href="explore.html?model=available" class="btn-museum btn-museum--primary btn-museum--sm">
                    <span class="material-symbols-outlined" style="font-size:16px" aria-hidden="true">view_in_ar</span>
                    <span>Lihat Model 3D Tersedia</span>
                  </a>
                </div>
              </div>
            `}
          </div>
        </section>

        <!-- B. OVERVIEW & HISTORICAL CONTEXT -->
        <section class="museum-section museum-section--sand" aria-labelledby="overview-heading">
          <div class="museum-container">
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(290px, 1fr));gap:36px;align-items:start;">
              <div>
                <span class="eyebrow">01 · Ikhtisar & Konteks Sejarah</span>
                <h2 id="overview-heading" class="section-title" style="margin:10px 0 18px;">Latar Belakang Budaya & Sejarah</h2>
                <p style="font-size:1.02rem;line-height:1.75;color:var(--ink-primary);margin:0 0 16px;">${escapeHtml(house.introduction)}</p>
                <p style="font-size:0.95rem;line-height:1.75;color:var(--ink-secondary);margin:0;">${escapeHtml(house.historicalContext)}</p>
              </div>

              <div style="background:var(--bg-paper);border:1px solid var(--border-hairline);padding:24px;">
                <div class="spec-cell__label">Identitas Wilayah & Komunitas</div>
                <dl style="margin:0;display:grid;gap:14px;font-size:0.9rem;">
                  <div style="border-bottom:1px solid var(--border-hairline);padding-bottom:10px;">
                    <dt class="mono-caption">Wilayah / Kabupaten</dt>
                    <dd style="margin:4px 0 0;color:var(--ink-primary);">${escapeHtml(house.districtOrRegion)}</dd>
                  </div>
                  <div style="border-bottom:1px solid var(--border-hairline);padding-bottom:10px;">
                    <dt class="mono-caption">Komunitas Pendukung</dt>
                    <dd style="margin:4px 0 0;color:var(--ink-primary);">${escapeHtml(house.culturalCommunity)}</dd>
                  </div>
                  <div style="border-bottom:1px solid var(--border-hairline);padding-bottom:10px;">
                    <dt class="mono-caption">Tipologi Arsitektur</dt>
                    <dd style="margin:4px 0 0;color:var(--ink-primary);">${escapeHtml(house.architecturalType)}</dd>
                  </div>
                  <div>
                    <dt class="mono-caption">Fungsi Spasial Utama</dt>
                    <dd style="margin:4px 0 0;color:var(--ink-secondary);">${escapeHtml(house.spatialFunctions)}</dd>
                  </div>
                </dl>
              </div>
            </div>
          </div>
        </section>

        <!-- C. ARCHITECTURE SPECIFICATIONS -->
        <section class="museum-section" aria-labelledby="arch-heading">
          <div class="museum-container">
            <div class="section-header">
              <span class="eyebrow">02 · Spesifikasi Arsitektur & Tektonik</span>
              <h2 id="arch-heading" class="section-title">Struktur, Material & Adaptasi Iklim</h2>
            </div>

            <div class="spec-grid">
              <div class="spec-cell">
                <div class="spec-cell__label">Bentuk Atap (Roof Form)</div>
                <p class="spec-cell__value">${escapeHtml(house.architecturalFeatures.roofForm)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Sistem Struktural</div>
                <p class="spec-cell__value">${escapeHtml(house.structuralSystem)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Pondasi & Tumpuan</div>
                <p class="spec-cell__value">${escapeHtml(house.architecturalFeatures.foundation)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Dinding & Selubung</div>
                <p class="spec-cell__value">${escapeHtml(house.architecturalFeatures.walls)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Material Konstruksi Utama</div>
                <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;">
                  ${house.constructionMaterials.map((m) => `<span class="meta-chip">${escapeHtml(m)}</span>`).join('')}
                </div>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Tata Ruang (Spatial Layout)</div>
                <p class="spec-cell__value">${escapeHtml(house.architecturalFeatures.spatialLayout)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Teknik Konstruksi Tradisional</div>
                <p class="spec-cell__value">${escapeHtml(house.architecturalFeatures.constructionTechniques)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Adaptasi Iklim & Lingkungan</div>
                <p class="spec-cell__value">${escapeHtml(house.architecturalFeatures.climateAdaptation)}</p>
              </div>
            </div>
          </div>
        </section>

        <!-- D. CULTURAL MEANING -->
        <section class="museum-section museum-section--sand" aria-labelledby="culture-heading">
          <div class="museum-container">
            <div class="section-header">
              <span class="eyebrow">03 · Makna Budaya & Sosial</span>
              <h2 id="culture-heading" class="section-title">Simbolisme, Fungsi Sosial & Relevansi Adat</h2>
            </div>

            <div class="spec-grid">
              <div class="spec-cell">
                <div class="spec-cell__label">Simbolisme Arsitektur</div>
                <p class="spec-cell__value">${escapeHtml(house.culturalSignificance.symbolism)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Fungsi Tradisional</div>
                <p class="spec-cell__value">${escapeHtml(house.culturalSignificance.traditionalFunctions)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Organisasi Sosial & Kekerabatan</div>
                <p class="spec-cell__value">${escapeHtml(house.culturalSignificance.socialOrganization)}</p>
              </div>
              <div class="spec-cell">
                <div class="spec-cell__label">Relevansi Ritual & Upacara</div>
                <p class="spec-cell__value">${escapeHtml(house.culturalSignificance.ceremonialRelevance)}</p>
              </div>
            </div>
          </div>
        </section>

        <!-- D2. STRUCTURED 10-SECTION ARCHITECTURAL RESEARCH ARTICLE -->
        ${house.article ? `
          <section id="research-article-section" class="museum-section" aria-labelledby="article-heading">
            <div class="museum-container">
              <div class="section-header">
                <span class="eyebrow">Monografi Riset Arsitektur · 10 Bagian</span>
                <h2 id="article-heading" class="section-title">Artikel Kajian Lengkap: ${escapeHtml(house.houseName)}</h2>
                <p class="lead-copy" style="margin:8px 0 0;">
                  Disusun secara terstruktur dari arsip referensi rumah adat, literatur arsitektur vernakular Nusantara, dan dokumentasi komponen bangunan.
                </p>
              </div>
              <div class="article-10-grid">
                ${[
                  ['01', 'Asal-Usul Sejarah (Historical Origins)', house.article.historicalOrigins],
                  ['02', 'Konteks Budaya & Komunitas (Cultural Context)', house.article.culturalAndCommunityContext],
                  ['03', 'Identitas Arsitektur (Architectural Identity)', house.article.architecturalIdentity],
                  ['04', 'Sistem Struktural (Structural System)', house.article.structuralSystem],
                  ['05', 'Interior & Organisasi Ruang (Spatial Organization)', house.article.interiorAndSpatialOrganization],
                  ['06', 'Material & Konstruksi (Material & Construction)', house.article.materialAndConstruction],
                  ['07', 'Adaptasi Iklim (Climate Adaptation)', house.article.climateAdaptation],
                  ['08', 'Makna Budaya (Cultural Meaning)', house.article.culturalMeaning],
                  ['09', 'Pelestarian & Relevansi Kini (Preservation)', house.article.preservationAndContemporaryRelevance],
                  ['10', 'Rujukan & Sumber (References)', house.article.referencesSummary]
                ].map(([num, title, body]) => `
                  <article class="article-chapter">
                    <div class="article-chapter__num">Bagian ${num}</div>
                    <h3 class="article-chapter__title">${escapeHtml(title)}</h3>
                    <p class="article-chapter__body">${escapeHtml(body || 'Dalam verifikasi arsip lanjutan.')}</p>
                  </article>
                `).join('')}
              </div>
            </div>
          </section>
        ` : ''}

        <!-- E. EXPLORE THE COMPONENTS (Interactive Grid + Personal Study Notes) -->
        ${is3D && house.hotspots.length ? `
          <section class="museum-section" aria-labelledby="components-heading">
            <div class="museum-container">
              <div class="section-header section-header--split">
                <div>
                  <span class="eyebrow">04 · Eksplorasi Komponen Bangunan</span>
                  <h2 id="components-heading" class="section-title" style="margin-top:8px;">Daftar Anatomi Terhubung ke Kamera 3D</h2>
                  <p class="lead-copy" style="margin:8px 0 0;">Pilih salah satu komponen di bawah ini untuk langsung mengarahkan penampil 3D di atas ke bagian tersebut dan menyorot geometrinya.</p>
                </div>
              </div>

              <div class="houses-grid houses-grid--3">
                ${house.hotspots.map((hs, idx) => `
                  <article style="background:var(--bg-paper);border:1px solid var(--border-hairline);padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;">
                    <div>
                      <div class="mono-caption" style="color:var(--bronze);">Komponen 0${idx + 1} · ${escapeHtml(hs.localName)}</div>
                      <h3 class="card-title" style="font-size:1.15rem;margin:6px 0 8px;">${escapeHtml(hs.title)}</h3>
                      <p style="font-size:0.86rem;color:var(--ink-secondary);margin:0;line-height:1.6;">${escapeHtml(hs.practicalFunction)}</p>
                    </div>
                    <button
                      type="button"
                      class="btn-museum btn-museum--secondary btn-museum--sm"
                      data-focus-component="${escapeHtml(hs.id)}"
                    >
                      <span class="material-symbols-outlined" style="font-size:16px" aria-hidden="true">center_focus_strong</span>
                      <span>Fokuskan di Penampil 3D</span>
                    </button>
                  </article>
                `).join('')}
              </div>
            </div>
          </section>
        ` : ''}

        <!-- PERSONAL ARCHITECTURAL STUDY NOTES -->
        <section class="museum-section museum-section--sand" aria-labelledby="notes-heading">
          <div class="museum-container">
            <div style="max-width:760px;">
              <span class="eyebrow">Catatan Studi Pribadi</span>
              <h2 id="notes-heading" class="section-title" style="margin:8px 0 10px;">Catatan Penelitian untuk ${escapeHtml(house.houseName)}</h2>
              <p style="font-size:0.9rem;color:var(--ink-secondary);margin:0 0 16px;">
                Simpan pengamatan pribadi Anda tentang proporsi, struktur, atau konteks budaya bangunan ini. Catatan tersimpan secara lokal di browser dan dapat diakses kembali pada halaman <a href="profile.html" style="text-decoration:underline;">Jurnal Eksplorasi</a>.
              </p>
              <label for="personal-note-input" class="field-label">Catatan Arsitektur</label>
              <textarea id="personal-note-input" class="museum-textarea" rows="4" placeholder="Tulis catatan tentang sambungan kayu, tipologi atap, atau rujukan lapangan...">${escapeHtml(existingNote)}</textarea>
              <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
                <button type="button" id="save-note-btn" class="btn-museum btn-museum--primary btn-museum--sm">Simpan Catatan</button>
                <span id="note-status" class="mono-caption" aria-live="polite"></span>
              </div>
            </div>
          </div>
        </section>

        <!-- F. REFERENCES, MODEL ATTRIBUTION & PHOTO CREDITS -->
        <section class="museum-section" aria-labelledby="sources-heading">
          <div class="museum-container">
            <div class="section-header">
              <span class="eyebrow">05 · Sumber, Lisensi & Atribusi Terverifikasi</span>
              <h2 id="sources-heading" class="section-title">Referensi Ilmiah & Provenansi Aset</h2>
            </div>

            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:24px;">
              <div style="background:var(--bg-paper);border:1px solid var(--border-hairline);padding:24px;">
                <div class="spec-cell__label">Sumber & Rujukan Budaya</div>
                <ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;">
                  ${house.sources.map((src) => `
                    <li style="padding-bottom:12px;border-bottom:1px solid var(--border-hairline);">
                      <a href="${escapeHtml(src.url)}" target="_blank" rel="noopener noreferrer" style="font-weight:600;color:var(--bg-forest);text-decoration:underline;text-underline-offset:3px;">
                        ${escapeHtml(src.title)}
                      </a>
                      <div class="mono-caption" style="margin-top:3px;">${escapeHtml(src.publisher)}</div>
                      <p style="font-size:0.84rem;color:var(--ink-secondary);margin:4px 0 0;">${escapeHtml(src.note)}</p>
                    </li>
                  `).join('')}
                </ul>
              </div>

              <div style="background:var(--bg-paper);border:1px solid var(--border-hairline);padding:24px;">
                <div class="spec-cell__label">Atribusi Aset 3D & Foto Referensi</div>
                <dl style="margin:0;display:grid;gap:12px;font-size:0.88rem;">
                  <div>
                    <dt class="mono-caption">Pembuat Aset 3D</dt>
                    <dd style="margin:3px 0 0;">${escapeHtml(house.assetCreator)}</dd>
                  </div>
                  <div>
                    <dt class="mono-caption">Lisensi Aset</dt>
                    <dd style="margin:3px 0 0;">${escapeHtml(house.assetLicense)}</dd>
                  </div>
                  <div>
                    <dt class="mono-caption">Pernyataan Atribusi</dt>
                    <dd style="margin:3px 0 0;color:var(--ink-secondary);">${escapeHtml(house.attribution)}</dd>
                  </div>
                  <div>
                    <dt class="mono-caption">Status Verifikasi & Tinjauan Terakhir</dt>
                    <dd style="margin:3px 0 0;">${escapeHtml(house.verificationStatus)} · Ditinjau: ${escapeHtml(house.lastReviewedAt)}</dd>
                  </div>
                </dl>

                ${photo ? `
                  <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border-hairline);">
                    <div class="mono-caption" style="margin-bottom:8px;">Foto Referensi Terverifikasi</div>
                    <figure style="margin:0;">
                      <img src="${escapeHtml(photo.url)}" alt="${escapeHtml(photo.caption)}" style="width:100%;height:175px;object-fit:cover;border:1px solid var(--border-hairline);" />
                      <figcaption style="font-size:0.8rem;color:var(--ink-secondary);margin-top:8px;line-height:1.5;">
                        ${escapeHtml(photo.caption)}<br/>
                        Fotografer: <strong>${escapeHtml(photo.photographer)}</strong> · Lisensi:
                        <a href="${escapeHtml(photo.licenseUrl)}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline;">${escapeHtml(photo.license)}</a> ·
                        <a href="${escapeHtml(photo.sourceUrl)}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline;">Sumber Wikimedia Commons</a>
                      </figcaption>
                    </figure>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        </section>

        <!-- G. RELATED ARCHITECTURE -->
        <section class="museum-section museum-section--sand" aria-labelledby="related-heading">
          <div class="museum-container">
            <div class="section-header">
              <span class="eyebrow">06 · Arsitektur Terkait & Perbandingan</span>
              <h2 id="related-heading" class="section-title">Lanjutkan Eksplorasi Lintas Wilayah</h2>
            </div>

            ${related.sameIsland.length ? `
              <h3 class="mono-caption" style="margin:0 0 14px;color:var(--bronze);">Tradisi Lain di Pulau ${escapeHtml(house.island)}</h3>
              <div class="houses-grid houses-grid--3" style="margin-bottom:36px;">
                ${related.sameIsland.map((h) => renderHouseCard(h)).join('')}
              </div>
            ` : ''}

            <h3 class="mono-caption" style="margin:0 0 14px;color:var(--bronze);">Bentuk & Sistem Struktur Pembanding</h3>
            <div class="houses-grid houses-grid--3">
              ${[...related.similarStructure.slice(0, 2), ...related.contrasting.slice(0, 1)].map((h) => renderHouseCard(h, { showCompare: true })).join('')}
            </div>
          </div>
        </section>
      `;

      // Bind Personal Notes Save
      const noteBtn = document.getElementById('save-note-btn');
      const noteInput = document.getElementById('personal-note-input');
      const noteStatus = document.getElementById('note-status');
      noteBtn?.addEventListener('click', () => {
        MuseumStore.saveNote(house.id, noteInput.value);
        noteStatus.textContent = 'Catatan tersimpan ke Jurnal Eksplorasi.';
        setTimeout(() => { noteStatus.textContent = ''; }, 3000);
      });

      // Initialize Real Three.js 3D Viewer if model is available
      if (is3D) {
        const stageEl = document.getElementById('house-3d-stage');
        renderInspectorDetail(house, null);

        viewerInstance = new NularArchitectureViewer(stageEl, house, {
          compact: false,
          autoRotateDefault: false,
          onSelectHotspot: (hs) => {
            renderInspectorDetail(house, hs);
            if (hs) MuseumStore.recordComponentInspection(house.id, hs.id);
          }
        });

        // Expose strictly for clean programmatic inspection / accessibility debugging
        window.__NULAR_VIEWER__ = viewerInstance;

        // Bind component inspector list clicks & lower section focus buttons
        root.addEventListener('click', (e) => {
          const itemBtn = e.target.closest('[data-select-hotspot]');
          if (itemBtn && viewerInstance) {
            viewerInstance.selectHotspot(itemBtn.getAttribute('data-select-hotspot'));
            return;
          }
          const focusBtn = e.target.closest('[data-focus-component]');
          if (focusBtn && viewerInstance) {
            const id = focusBtn.getAttribute('data-focus-component');
            document.getElementById('explorer-stage')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            viewerInstance.selectHotspot(id);
          }
        });
      }
    }

    initHouseDetail().catch((err) => {
      console.error('House Detail Error:', err);
    });
  </script>
</body>
</html>
