<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-jalak" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="70%" stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#bg-jalak)" stroke="#E0F7FA" stroke-width="6"/>
  <!-- Pristine White Feather Body -->
  <ellipse cx="100" cy="125" rx="48" ry="48" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="2"/>
  <!-- White Crest Feathers (Jambul Khas Jalak Bali) -->
  <path d="M 90,60 Q 65,15 75,5 Q 85,30 95,50" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
  <path d="M 100,55 Q 90,5 100,0 Q 105,25 105,50" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
  <path d="M 105,58 Q 125,15 135,10 Q 125,35 112,52" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="34" fill="#FFFFFF"/>
  <!-- Signature Cobalt Blue Mask around eye (Topeng Biru) -->
  <ellipse cx="88" cy="82" rx="16" ry="12" fill="#1E88E5"/>
  <circle cx="88" cy="82" r="6" fill="#212121"/>
  <circle cx="86" cy="80" r="2.5" fill="#FFFFFF"/>
  <!-- Yellow Pointy Beak -->
  <polygon points="60,86 40,88 58,95" fill="#FDD835" stroke="#F57F17" stroke-width="1.5"/>
  <!-- Cheeks Blush -->
  <circle cx="102" cy="95" r="6" fill="#FF8A80" opacity="0.6"/>
  <!-- Frangipani Bali Flower (Bunga Kamboja) in Crest -->
  <g transform="translate(125, 65) scale(0.65)">
    <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#FFFFFF" stroke="#FFE082"/>
    <ellipse cx="14" cy="-4" rx="8" ry="14" fill="#FFFFFF" stroke="#FFE082" transform="rotate(72, 14, -4)"/>
    <ellipse cx="9" cy="12" rx="8" ry="14" fill="#FFFFFF" stroke="#FFE082" transform="rotate(144, 9, 12)"/>
    <ellipse cx="-9" cy="12" rx="8" ry="14" fill="#FFFFFF" stroke="#FFE082" transform="rotate(216, -9, 12)"/>
    <ellipse cx="-14" cy="-4" rx="8" ry="14" fill="#FFFFFF" stroke="#FFE082" transform="rotate(288, -14, -4)"/>
    <circle cx="0" cy="0" r="6" fill="#FDD835"/>
  </g>
  <!-- Bali Poleng (Black-White Checkered) Scarf Collar -->
  <path d="M 65,120 Q 100,140 135,120" fill="none" stroke="#212121" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 10"/>
</svg>