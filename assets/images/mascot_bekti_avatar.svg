<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-bekti" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="70%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <linearGradient id="skin-bekti" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#bg-bekti)" stroke="#A5D6A7" stroke-width="6"/>
  <!-- Ears -->
  <circle cx="45" cy="90" r="16" fill="#D84315"/>
  <circle cx="45" cy="90" r="10" fill="#FFAB91"/>
  <circle cx="155" cy="90" r="16" fill="#D84315"/>
  <circle cx="155" cy="90" r="10" fill="#FFAB91"/>
  <!-- Fur Hood & Head -->
  <circle cx="100" cy="95" r="52" fill="#D84315"/>
  <circle cx="100" cy="98" r="42" fill="url(#skin-bekti)"/>
  <!-- Eyes -->
  <ellipse cx="80" cy="85" rx="7" ry="9" fill="#212121"/>
  <circle cx="78" cy="83" r="3" fill="#FFFFFF"/>
  <ellipse cx="120" cy="85" rx="7" ry="9" fill="#212121"/>
  <circle cx="118" cy="83" r="3" fill="#FFFFFF"/>
  <!-- Signature Large Proboscis Nose (Hidung Bekantan) -->
  <ellipse cx="100" cy="112" rx="16" ry="22" fill="#E64A19"/>
  <ellipse cx="97" cy="108" rx="12" ry="16" fill="#FF7043"/>
  <!-- Friendly Smile under nose -->
  <path d="M 88,138 Q 100,146 112,138" fill="none" stroke="#4E342E" stroke-width="3" stroke-linecap="round"/>
  <!-- Dayak Headband (Seraung / Ikat Kepala Manik Dayak) -->
  <rect x="58" y="58" width="84" height="12" rx="4" fill="#FFD54F" stroke="#C62828" stroke-width="2"/>
  <circle cx="72" cy="64" r="3" fill="#C62828"/>
  <circle cx="86" cy="64" r="3" fill="#1565C0"/>
  <circle cx="100" cy="64" r="3" fill="#2E7D32"/>
  <circle cx="114" cy="64" r="3" fill="#1565C0"/>
  <circle cx="128" cy="64" r="3" fill="#C62828"/>
  <!-- Dayak Feather in headband -->
  <path d="M 100,58 Q 115,20 120,10 Q 110,35 100,58 Z" fill="#FFFFFF" stroke="#212121" stroke-width="1.5"/>
  <path d="M 107,35 L 115,35" stroke="#C62828" stroke-width="3"/>
</svg>