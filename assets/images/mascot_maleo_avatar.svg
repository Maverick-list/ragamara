<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg-maleo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CE93D8"/>
      <stop offset="70%" stop-color="#6A1B9A"/>
      <stop offset="100%" stop-color="#311B92"/>
    </radialGradient>
    <linearGradient id="breast-maleo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="50%" stop-color="#F8BBD0"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </linearGradient>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#bg-maleo)" stroke="#E1BEE7" stroke-width="6"/>
  <!-- Body (Soft Peach/Rosy Breast Feather) -->
  <ellipse cx="100" cy="130" rx="46" ry="48" fill="url(#breast-maleo)"/>
  <!-- Dark Black Wings on Sides -->
  <path d="M 45,115 Q 60,165 80,175" fill="none" stroke="#212121" stroke-width="16" stroke-linecap="round"/>
  <path d="M 155,115 Q 140,165 120,175" fill="none" stroke="#212121" stroke-width="16" stroke-linecap="round"/>
  <!-- Head (Jet Black Feathers) -->
  <circle cx="100" cy="82" r="32" fill="#212121"/>
  <!-- Distinctive Maleo Helmet / Bony Casque (Tonjolan Tanduk Hitam Mengkilap) -->
  <ellipse cx="100" cy="50" rx="16" ry="18" fill="#1A1A1A" stroke="#424242" stroke-width="2"/>
  <ellipse cx="96" cy="46" rx="10" ry="12" fill="#37474F"/>
  <!-- Yellow Orbital Skin around Eye -->
  <circle cx="84" cy="80" r="12" fill="#FFD54F"/>
  <circle cx="84" cy="80" r="7" fill="#212121"/>
  <circle cx="82" cy="78" r="2.5" fill="#FFFFFF"/>
  <!-- Red/Orange Beak -->
  <polygon points="64,84 45,88 64,96" fill="#FF5722" stroke="#BF360C" stroke-width="1"/>
  <!-- Cheerful Rosy Blush -->
  <circle cx="102" cy="94" r="6" fill="#EC407A" opacity="0.7"/>
  <!-- Toraja Patterned Beads Collar -->
  <path d="M 70,118 Q 100,132 130,118" fill="none" stroke="#FFCA28" stroke-width="6" stroke-linecap="round"/>
  <circle cx="85" cy="124" r="3" fill="#D32F2F"/>
  <circle cx="100" cy="126" r="3" fill="#FFFFFF"/>
  <circle cx="115" cy="124" r="3" fill="#D32F2F"/>
</svg>