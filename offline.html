<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mode Offline — NULAR</title>
  <meta name="theme-color" content="#153027" />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="stylesheet" href="css/museum.css" />
  <style>
    .offline-card {
      max-width: 540px;
      margin: 80px auto;
      padding: 40px 32px;
      background: var(--bg-paper);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      text-align: center;
      box-shadow: var(--shadow-panel);
    }
    .offline-icon {
      font-size: 56px;
      color: var(--bronze);
      margin-bottom: 16px;
    }
    .offline-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }
    @media (min-width: 480px) {
      .offline-links {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>
<body style="min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg-sandstone);">
  <main class="offline-card" role="main">
    <div class="brand-mark" style="justify-content: center; margin-bottom: 20px;">
      <span class="brand-mark__emblem" aria-hidden="true">N</span>
      <span class="brand-mark__text">
        <span class="brand-mark__name">NULAR</span>
        <span class="brand-mark__sub">Living Heritage World</span>
      </span>
    </div>
    <div class="offline-icon" aria-hidden="true" style="display:flex;align-items:center;justify-content:center;width:68px;height:68px;margin:0 auto 16px;border-radius:50%;background:rgba(156,122,76,0.12);border:1px solid rgba(156,122,76,0.32);">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
        <path d="M5 13a10 10 0 0 1 5.24-2.76"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1 style="font-family: var(--font-serif); font-size: 1.6rem; margin: 0 0 10px;">Anda Sedang Offline</h1>
    <p style="font-size: 0.92rem; color: var(--ink-secondary); line-height: 1.65; margin: 0 0 20px;">
      Koneksi jaringan terputus. Sebagian besar arsip data tekstual dan halaman yang telah dikunjungi sebelumnya tetap dapat diakses dari cache perangkat Anda.
    </p>
    <button type="button" onclick="window.location.reload()" class="btn-museum btn-museum--bronze" style="margin-bottom: 16px; width: 100%; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span>Muat Ulang Halaman</span>
    </button>
    <div class="offline-links">
      <a href="index.html" class="btn-museum btn-museum--secondary btn-museum--sm">Ke Beranda</a>
      <a href="map.html" class="btn-museum btn-museum--secondary btn-museum--sm">Peta Provinsi</a>
      <a href="profile.html" class="btn-museum btn-museum--secondary btn-museum--sm">Jurnal Tersimpan</a>
    </div>
  </main>
</body>
</html>
