<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NULAR — Redirecting to Architecture Museum</title>
  <link rel="stylesheet" href="css/museum.css" />
  <script>
    (function () {
      const hash = (window.location.hash || '').toLowerCase();
      let dest = 'explore.html';
      if (hash.includes('petualangan') || hash.includes('peta')) dest = 'map.html';
      else if (hash.includes('profil')) dest = 'profile.html';
      else if (hash.includes('beranda')) dest = 'index.html';
      window.location.replace(dest);
    })();
  </script>
</head>
<body style="display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center;">
  <main>
    <span class="eyebrow">NULAR — Nusa Learn</span>
    <h1 class="section-title" style="margin:12px 0;">Menuju Museum Arsitektur 3D Nusantara</h1>
    <p class="lead-copy" style="margin:0 auto 20px;">
      NULAR telah bertransformasi menjadi Museum Digital Arsitektur Tradisional Indonesia. Jika tidak dialihkan otomatis, pilih halaman tujuan di bawah ini:
    </p>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;">
      <a href="index.html" class="btn-museum btn-museum--primary">Home — The Living Atlas</a>
      <a href="explore.html" class="btn-museum btn-museum--secondary">Explore — House Collection</a>
      <a href="map.html" class="btn-museum btn-museum--secondary">Architecture Map</a>
    </div>
  </main>
</body>
</html>
