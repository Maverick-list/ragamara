<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NULAR 3D Model Multi-Angle Viewer</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0c10; color: #fff; font-family: sans-serif; overflow: hidden; }
    #canvas-container { width: 1200px; height: 900px; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 4px; font-size: 14px; font-family: monospace; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/js/vendor/three/build/three.module.js",
        "three/addons/": "/js/vendor/three/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div id="info">Initializing Viewer...</div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from '/js/vendor/three/loaders/GLTFLoader.js';

    let scene, camera, renderer, currentModel = null;
    const container = document.getElementById('canvas-container');
    const info = document.getElementById('info');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x12151c);

    camera = new THREE.PerspectiveCamera(45, 1200 / 900, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1200, 900);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // Studio Lighting
    const hemiLight = new THREE.HemisphereLight(0xfff7ed, 0x1f2937, 1.2);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
    sunLight.position.set(20, 35, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xa5b4fc, 0.8);
    fillLight.position.set(-20, 15, -20);
    scene.add(fillLight);

    // Subtle ground grid
    const grid = new THREE.GridHelper(30, 30, 0x374151, 0x1f2937);
    grid.position.y = -0.01;
    scene.add(grid);

    const loader = new GLTFLoader();

    window.loadModel = function(modelUrl) {
      return new Promise((resolve, reject) => {
        if (currentModel) {
          scene.remove(currentModel);
          currentModel = null;
        }
        info.textContent = `Loading ${modelUrl}...`;
        loader.load(
          modelUrl,
          (gltf) => {
            currentModel = gltf.scene;
            scene.add(currentModel);

            // Compute bounding box and center
            const box = new THREE.Box3().setFromObject(currentModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            window._modelBounds = { center, size, box };
            info.textContent = `Loaded: ${modelUrl} | Bounding: ${size.x.toFixed(1)}x${size.y.toFixed(1)}x${size.z.toFixed(1)}m`;
            resolve({ size, center });
          },
          undefined,
          (err) => {
            info.textContent = `Error: ${err.message}`;
            reject(err);
          }
        );
      });
    };

    window.setCameraAngle = function(angleName) {
      if (!window._modelBounds) return;
      const { center, size } = window._modelBounds;
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.6;

      if (angleName === 'iso') {
        camera.position.set(center.x + dist * 0.75, center.y + dist * 0.55, center.z + dist * 0.75);
        camera.lookAt(center.x, center.y + size.y * 0.2, center.z);
      } else if (angleName === 'front') {
        camera.position.set(center.x, center.y + size.y * 0.35, center.z + dist * 1.1);
        camera.lookAt(center.x, center.y + size.y * 0.35, center.z);
      } else if (angleName === 'side') {
        camera.position.set(center.x + dist * 1.1, center.y + size.y * 0.35, center.z);
        camera.lookAt(center.x, center.y + size.y * 0.35, center.z);
      } else if (angleName === 'rear') {
        camera.position.set(center.x, center.y + size.y * 0.35, center.z - dist * 1.1);
        camera.lookAt(center.x, center.y + size.y * 0.35, center.z);
      } else if (angleName === 'top') {
        camera.position.set(center.x, center.y + dist * 1.4, center.z + 0.001);
        camera.lookAt(center.x, center.y, center.z);
      } else if (angleName === 'interior') {
        // Position inside lower center
        camera.position.set(center.x, center.y + 0.9, center.z + 0.2);
        camera.lookAt(center.x, center.y + 1.2, center.z - 2.5);
      } else if (angleName === 'detail') {
        camera.position.set(center.x + dist * 0.3, center.y + size.y * 0.6, center.z + dist * 0.4);
        camera.lookAt(center.x, center.y + size.y * 0.7, center.z);
      }
      renderer.render(scene, camera);
      return true;
    };

    window.getScreenshot = function() {
      renderer.render(scene, camera);
      return renderer.domElement.toDataURL('image/jpeg', 0.9);
    };

    window.isReady = true;
  </script>
</body>
</html>
